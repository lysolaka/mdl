[package]
name = "mdl"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A CLI music downloader based on specfiles"
repository = "https://github.com/lysolaka/mdl"
readme = "README.md"

[dependencies]
anstyle = "1.0.8"
id3 = "1.16.3"
itertools = "0.14.0"
log = "0.4.28"
metaflac = "0.2.8"
once_cell = "1.21.3"
pythonize = "0.26.0"
thiserror = "2.0.16"
url = "2.5.7"

[dependencies.clap]
version = "4.5.48"
features = ["derive", "wrap_help"]

[dependencies.infer]
version = "0.19.0"
default-features = false

[dependencies.pyo3]
version = "0.26.0"
features = ["auto-initialize"]

[dependencies.reqwest]
version = "0.12.23"
features = ["blocking"]

[dependencies.rustc-hash]
version = "2.1.1"
default-features = false

[dependencies.serde]
version = "1.0.225"
features = ["derive"]

[dependencies.toml]
version = "0.9.6"
features = ["preserve_order"]
